name: Validar e publicar aplicação estática
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build:qa
      - run: npm run test:budget
      - name: Compartilhar os builds para validação
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-builds
          path: |
            dist-browser/
            dist-browser-test/
          if-no-files-found: error
          retention-days: 1
  browser:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8.0.2
        with:
          name: browser-builds
      # O navegador fica em cache pela revisão definida no Playwright. As dependências do sistema
      # (apt) e o download do navegador são passos separados: o apt tem retentativas e tempo limite
      # próprios, e o download do navegador, que ocasionalmente trava, tem limite e até três tentativas
      # sem processos do apt que possam segurar o bloqueio do dpkg entre elas.
      - name: Restaurar navegadores do Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.browser }}-${{ hashFiles('node_modules/playwright-core/browsers.json') }}
      - name: Instalar as dependências do sistema do navegador
        timeout-minutes: 10
        run: |
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\n' |
            sudo tee /etc/apt/apt.conf.d/80-ci-retries > /dev/null
          npx playwright install-deps ${{ matrix.browser }}
      - name: Instalar o navegador do Playwright
        timeout-minutes: 8
        run: |
          for attempt in 1 2 3; do
            if timeout 150 npx playwright install ${{ matrix.browser }}; then exit 0; fi
            echo "::warning::Download do navegador falhou ou excedeu o tempo (tentativa $attempt de 3)."
            sleep 10
          done
          exit 1
      - name: Executar testes no navegador
        id: browser_tests
        run: npm run test:browser -- --skip-build
        env:
          CONTRATOS_QA_BROWSER: ${{ matrix.browser }}
          CONTRATOS_QA_DIAGNOSTICS_DIR: ${{ runner.temp }}/browser-diagnostics
      - name: Guardar evidências da falha
        if: failure() && steps.browser_tests.conclusion == 'failure'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-failure-${{ matrix.browser }}
          path: ${{ runner.temp }}/browser-diagnostics
          if-no-files-found: warn
          retention-days: 7
  deploy:
    needs: [validate, browser]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8.0.2
        with:
          name: browser-builds
      - name: Preparar artefato validado para publicação
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist-browser
      - name: Publicar artefato validado
        id: deployment
        uses: actions/deploy-pages@v5.0.1
      - name: Verificar site publicado
        run: node test/verify-deployment.mjs
        env:
          SITE_URL: https://contratos-web.net.br/
