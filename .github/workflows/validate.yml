name: Validar e publicar aplicação estática
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build:qa
      - run: npm run test:budget
      - name: Compartilhar os builds para validação
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-builds
          path: |
            dist-browser/
            dist-browser-test/
          if-no-files-found: error
          retention-days: 1
  browser:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8.0.2
        with:
          name: browser-builds
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Executar testes no navegador
        id: browser_tests
        run: npm run test:browser -- --skip-build
        env:
          COMPRAS_QA_BROWSER: ${{ matrix.browser }}
          COMPRAS_QA_DIAGNOSTICS_DIR: ${{ runner.temp }}/browser-diagnostics
      - name: Guardar evidências da falha
        if: failure() && steps.browser_tests.conclusion == 'failure'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-failure-${{ matrix.browser }}
          path: ${{ runner.temp }}/browser-diagnostics
          if-no-files-found: warn
          retention-days: 7
  deploy:
    needs: [validate, browser]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8.0.2
        with:
          name: browser-builds
      - name: Preparar artefato validado para publicação
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist-browser
      - name: Publicar artefato validado
        id: deployment
        uses: actions/deploy-pages@v5.0.1
      - name: Verificar site publicado
        run: node test/verify-deployment.mjs
        env:
          SITE_URL: https://contratos-web.net.br/
