name: Validar compatibilidade WebKit
on:
  schedule:
    - cron: '20 7 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: webkit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:qa
      # O navegador fica em cache pela revisão definida no Playwright. As dependências do sistema
      # (apt) e o download do navegador são passos separados: o apt tem retentativas e tempo limite
      # próprios, e o download do navegador, que ocasionalmente trava, tem limite e até três tentativas
      # sem processos do apt que possam segurar o bloqueio do dpkg entre elas.
      - name: Restaurar navegadores do Playwright
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-webkit-${{ hashFiles('node_modules/playwright-core/browsers.json') }}
      # Os pacotes .deb das dependências ficam em cache: o espelho do Ubuntu às vezes entrega as
      # fontes a dezenas de KB/s. A chave muda a cada execução para o cache acompanhar novas versões.
      - name: Restaurar pacotes do sistema do navegador
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/apt-browser
          key: apt-browser-${{ runner.os }}-webkit-${{ github.run_id }}
          restore-keys: apt-browser-${{ runner.os }}-webkit-
      - name: Instalar as dependências do sistema do navegador
        timeout-minutes: 15
        run: |
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAPT::Keep-Downloaded-Packages "true";\n' |
            sudo tee /etc/apt/apt.conf.d/80-ci-retries > /dev/null
          mkdir -p ~/.cache/apt-browser
          sudo cp ~/.cache/apt-browser/*.deb /var/cache/apt/archives/ 2> /dev/null || true
          npx playwright install-deps webkit
          cp /var/cache/apt/archives/*.deb ~/.cache/apt-browser/ 2> /dev/null || true
      - name: Instalar o navegador do Playwright
        timeout-minutes: 8
        run: |
          for attempt in 1 2 3; do
            if timeout 150 npx playwright install webkit; then exit 0; fi
            echo "::warning::Download do navegador falhou ou excedeu o tempo (tentativa $attempt de 3)."
            sleep 10
          done
          exit 1
      - name: Executar testes no WebKit
        id: webkit_tests
        run: npm run test:browser -- --skip-build
        env:
          CONTRATOS_QA_BROWSER: webkit
          CONTRATOS_QA_DIAGNOSTICS_DIR: ${{ runner.temp }}/webkit-diagnostics
      - name: Guardar evidências da falha
        if: failure() && steps.webkit_tests.conclusion == 'failure'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-failure-webkit
          path: ${{ runner.temp }}/webkit-diagnostics
          if-no-files-found: warn
          retention-days: 7
