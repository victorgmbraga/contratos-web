name: Validar compatibilidade WebKit
on:
  schedule:
    - cron: '20 7 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: webkit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:qa
      # O navegador fica em cache por versão do Playwright; a instalação tem limite de tempo e repete
      # em caso de falha, pois o download ocasionalmente trava nos runners.
      - name: Restaurar navegadores do Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-webkit-${{ hashFiles('package-lock.json') }}
      - name: Instalar o navegador do Playwright
        timeout-minutes: 9
        run: |
          for attempt in 1 2 3; do
            if timeout 150 npx playwright install --with-deps webkit; then exit 0; fi
            echo "::warning::Instalação do navegador falhou ou excedeu o tempo (tentativa $attempt de 3)."
            sleep 10
          done
          exit 1
      - name: Executar testes no WebKit
        id: webkit_tests
        run: npm run test:browser -- --skip-build
        env:
          CONTRATOS_QA_BROWSER: webkit
          CONTRATOS_QA_DIAGNOSTICS_DIR: ${{ runner.temp }}/webkit-diagnostics
      - name: Guardar evidências da falha
        if: failure() && steps.webkit_tests.conclusion == 'failure'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-failure-webkit
          path: ${{ runner.temp }}/webkit-diagnostics
          if-no-files-found: warn
          retention-days: 7
