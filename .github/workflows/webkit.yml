name: Validar compatibilidade WebKit
on:
  schedule:
    - cron: '20 7 * * 1'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: webkit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:qa
      - run: npx playwright install --with-deps webkit
      - name: Executar testes no WebKit
        id: webkit_tests
        run: npm run test:browser -- --skip-build
        env:
          COMPRAS_QA_BROWSER: webkit
          COMPRAS_QA_DIAGNOSTICS_DIR: ${{ runner.temp }}/webkit-diagnostics
      - name: Guardar evidências da falha
        if: failure() && steps.webkit_tests.conclusion == 'failure'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-failure-webkit
          path: ${{ runner.temp }}/webkit-diagnostics
          if-no-files-found: warn
          retention-days: 7
